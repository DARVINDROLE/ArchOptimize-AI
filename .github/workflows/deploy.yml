name: Deploy to Hugging Face Space

# Runs after CI passes on main (or manually). Needs the repository secret HF_TOKEN
# (GitHub → Settings → Secrets and variables → Actions → New repository secret).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  SPACE_ID: Laukik7/ArchOptimize-AI

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Cache source PDFs and embedding model
        uses: actions/cache@v4
        with:
          path: |
            data/source_docs
            .cache/fastembed
          key: knowledge-${{ hashFiles('archoptimize/knowledge_base/**') }}
      - name: Build the documentation index (~6 min on CPU)
        run: uv run python -m archoptimize.knowledge_base.index_builder
      - name: Export requirements for the Space
        run: uv export --no-dev --no-hashes --no-emit-project -o requirements.txt
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m deployment.push_to_space --space "$SPACE_ID" --message "Deploy ${{ github.sha }}"
