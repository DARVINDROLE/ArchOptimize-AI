name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: requirements.txt matches uv.lock (Render installs from requirements.txt)
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)             || (echo "requirements.txt is stale: run uv export --no-dev --no-hashes --no-emit-project -o requirements.txt" && exit 1)
      - name: Unit tests (no keys, no network except the local MCP subprocess)
        run: uv run python -m pytest
      - name: Evaluation floor (rubber stamp, no LLM)
        run: uv run python -m evaluation.run_evaluation --reviewer rubber_stamp --no-save
